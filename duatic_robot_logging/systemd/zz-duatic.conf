# Sorts after Ubuntu's syslog.conf, so ForwardToSyslog here wins.
[Journal]
Storage=persistent
SyncIntervalSec=10s
# Containers log through dockerd, so the per-service limit would be shared by all of them.
RateLimitIntervalSec=0
# The journal keeps everything, a copy in /var/log/syslog would have no size limit.
ForwardToSyslog=no
