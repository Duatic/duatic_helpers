name: Nightly image

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "Comma-separated distros to build, e.g. 'jazzy,kilted'. Empty builds the factory's default set."
        default: ""
      publish:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

jobs:
  image:
    permissions:
      contents: write   # image-badges branch
      packages: write
    uses: Duatic/duatic_ros2_base_images/.github/workflows/reusable_nightly_image.yml@v1
    with:
      ros_distro: ${{ inputs.ros_distro }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
    secrets: inherit
