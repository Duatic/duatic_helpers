name: Nightly image

# Canary for Duatic/duatic_ros2_base_images#29 (multi-arch, pinned to its branch until release).
# A push changing this file runs it, for every distro.
on:
  push:
    branches: [test/factory]
    paths: [.github/workflows/nightly_image.yml]
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "Comma-separated distros to build, e.g. 'jazzy,kilted'. Empty builds the factory's default set."
        default: ""
      publish:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

jobs:
  image:
    permissions:
      contents: write
      packages: write
    uses: Duatic/duatic_ros2_base_images/.github/workflows/reusable_nightly_image.yml@feat/multi-arch-images
    with:
      ros_distro: ${{ inputs.ros_distro }}
      publish: ${{ github.event_name == 'push' || inputs.publish }}
    secrets: inherit
