name: Nightly image

on:
  push:
    branches: [test/fused-ci]
    paths: [.github/workflows/nightly_image.yml]
  schedule:
    - cron: '0 2 * * *'
      timezone: "Europe/Zurich"
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "Comma-separated distros to build, e.g. 'jazzy,kilted'. Empty builds the factory's default set."
        default: ""
      publish:
        description: "Push the images to ghcr.io"
        type: boolean
        default: false

jobs:
  image:
    permissions:
      contents: write   # image-badges branch
      packages: write
    uses: Duatic/duatic_ros2_docker_images/.github/workflows/reusable_nightly_image.yml@feat/build-image-action
    with:
      ros_distro: ${{ github.event_name == 'push' && 'jazzy' || inputs.ros_distro }}
      publish: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
    secrets: inherit
