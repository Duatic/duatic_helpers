name: Release image

# Releases ghcr.io/duatic/helpers:<distro>-<version> and helpers-dev:<distro>-<version> for amd64
# and arm64 through the image factory (Duatic/duatic_ros2_base_images), moves their :<distro>,
# and creates the release/<distro>/<version> tag and GitHub Release. Release tags are
# immutable: a version that already exists is refused.
on:
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "ROS distro to release"
        required: true
        type: choice
        options: [jazzy, kilted, lyrical, rolling]
      version:
        description: "Version to tag (e.g. 1.0.0); must not already exist"
        required: true

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: Duatic/duatic_ros2_base_images/.github/workflows/reusable_release_image.yml@v1
    with:
      ros_distro: ${{ inputs.ros_distro }}
      version: ${{ inputs.version }}
    secrets: inherit
