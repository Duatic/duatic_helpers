name: Release image

# Canary for Duatic/duatic_ros2_base_images#13. A push to test/factory that changes this file
# releases ghcr.io/duatic/helpers/jazzy-runtime:0.0.1-test, moves its :stable, and creates the
# release/jazzy/0.0.1-test tag and GitHub Release. Delete all three afterwards; a second run with
# the same version fails, since release tags are immutable.
on:
  push:
    branches: [test/factory]
    paths: [.github/workflows/release_image.yml]
  workflow_dispatch:
    inputs:
      ros_distro:
        description: "ROS distro to release"
        required: true
        type: choice
        options: [humble, jazzy, kilted, lyrical, rolling]
      version:
        description: "Version to tag (e.g. 1.0.0); must not already exist"
        required: true

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: Duatic/duatic_ros2_base_images/.github/workflows/release-image.yml@v1
    with:
      ros_distro: ${{ github.event_name == 'push' && 'jazzy' || inputs.ros_distro }}
      version: ${{ github.event_name == 'push' && '0.0.1-test' || inputs.version }}
    secrets: inherit
