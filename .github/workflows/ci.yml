name: CI
on:
  workflow_dispatch:
    inputs:
      ros_distro:
        description: 'Distro to build'
        type: choice
        options: [all, jazzy, kilted, lyrical, rolling]
        default: all
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # Run every morning at 01:00 to detect flakiness and broken dependencies
    - cron: '0 1 * * *'
      timezone: "Europe/Zurich"

jobs:
  ci:
    # Canary for Duatic/duatic_ros2_base_images#13: ci-workflows v2 (Duatic/ci-workflows#48)
    permissions:
      contents: write
      packages: write
    uses: Duatic/ci-workflows/.github/workflows/ci_orchestrator.yml@feat/factory-ci
    with:
      ros_distro: ${{ inputs.ros_distro }}
      badge_branch: true
    secrets: inherit
